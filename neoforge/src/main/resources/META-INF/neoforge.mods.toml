modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "eliasnvx"
# pixel art: shown crisp in the mod list (catgirl:icon.png = assets/catgirl/icon.png)
iconFile = "catgirl:icon.png"
iconBlur = false
logoFile = "catgirl:icon.png"
logoBlur = false
description = '''
Catgirl & catboy cosmetics: cat ears, tails, paws and collars with bells, plus a meow key, catnip and a cardboard box.
'''

[[mixins]]
config = "catgirl.mixins.json"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},1.21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "architectury"
type = "required"
versionRange = "[${architectury_api_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
type = "required"
versionRange = "[${geckolib_version},)"
ordering = "AFTER"
side = "BOTH"

# Soft dependencies (compat.*): used when present, never required
[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "[19,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "[15,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
type = "optional"
versionRange = "[9,)"
ordering = "NONE"
side = "BOTH"
