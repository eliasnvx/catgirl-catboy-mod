apply plugin: "com.gradleup.shadow"

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"
    modImplementation "software.bernie.geckolib:geckolib-neoforge-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }

    // Curios: wear our cosmetics in its slots (compat.curios). Compile only; -Pcompat=true also loads Curios, JEI and
    // Jade in the dev runs (runClient, runDevCheck)
    modCompileOnly("maven.modrinth:curios:${rootProject.curios_neoforge_version}") { transitive false }
    if (project.findProperty("compat") == "true") {
        modRuntimeOnly("maven.modrinth:curios:${rootProject.curios_neoforge_version}") { transitive false }
        modRuntimeOnly("mezz.jei:jei-${rootProject.minecraft_version}-neoforge:${rootProject.jei_version}") { transitive false }
        modRuntimeOnly("net.mezzdev.config:mezz_config-${rootProject.minecraft_version}-neoforge:${rootProject.mezz_config_version}") { transitive false }
        modRuntimeOnly("maven.modrinth:jade:${rootProject.jade_neoforge_version}") { transitive false }
    }
    shadowBundle(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

// Dev-only check on NeoForge (1.21.1 has no client GameTests): opens run/saves/catgirl-check (created flat on the first run),
// dresses the player, places blocks and mobs, takes screenshots into run/screenshots and quits. ./gradlew :neoforge:runDevCheck
loom {
    runs {
        devCheck {
            client()
            name "NeoForge Dev Check"
            property "catgirl.devcheck", "true"
        }
        // Server GameTests: the shared bodies in common/.../gametest, registered by dev/CatgirlGameTestsNeoForge
        gameTestServer {
            server()
            forgeTemplate("gameTestServer")
            // The 21.1 template starts a plain dedicated server: switch it into test mode explicitly
            property "neoforge.gameTestServer", "true"
            property "neoforge.enabledGameTestNamespaces", "catgirl"
            name "NeoForge GameTest Server"
            runDir "build/run/gameTest"
        }
    }
}

// `build` -> `check` -> GameTests on NeoForge too (Fabric wires runGameTest into build itself)
tasks.named("check") { dependsOn "runGameTestServer" }

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
    exclude "fabric.mod.json"
    exclude "dev/eliasnvx/catgirl/neoforge/dev/**" // DevCheck and the GameTest glue stay out of the released jar
    exclude "dev/eliasnvx/catgirl/gametest/**"
    exclude "data/catgirl/structure/empty.nbt"
    exclude "architectury.common.json"
    from rootProject.file("LICENSE")
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
    archiveClassifier = null
    archiveVersion = "${project.version}+${rootProject.minecraft_version}-neoforge"
}
