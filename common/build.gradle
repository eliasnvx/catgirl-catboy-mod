architectury {
    common(rootProject.platforms.split(","))
}

dependencies {
    // Only for @Environment-style annotations; do NOT use other Fabric Loader classes in common
    compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    modImplementation "dev.architectury:architectury:${rootProject.architectury_api_version}"
    modImplementation "software.bernie.geckolib:geckolib-common-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    // Soft dependencies: only compat.jei / compat.jade touch them, and only JEI / Jade load those classes.
    // Jade's API is the same in both loader jars; the Fabric one is used to compile.
    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}"
    modCompileOnly("maven.modrinth:jade:${rootProject.jade_fabric_version}") { transitive false }
}

// The Blockbench and character exports live on the 26.3 branch only: art is authored there.
