architectury {
    common(rootProject.platforms.split(","))
}

dependencies {
    // Only for @Environment-style annotations; do NOT use other Fabric Loader classes in common
    compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    implementation "dev.architectury:architectury:${rootProject.architectury_api_version}"
    implementation "com.geckolib:geckolib-common-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    // Soft dependencies: only compat.jei / compat.jade touch them, and only JEI / Jade load those classes.
    // Jade's API is the same in both loader jars; the Fabric one is used to compile.
    compileOnly "mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}"
    compileOnly("maven.modrinth:jade:${rootProject.jade_fabric_version}") { transitive false }
}

// Dev tool: code cosmetic models -> starting Blockbench/GeckoLib files in art/blockbench (art/blockbench/README.md)
tasks.register("exportBlockbenchStarters", JavaExec) {
    group = "catgirl"
    description = "Exports every code cosmetic model as a starting .geo.json + fur texture into art/blockbench"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "dev.eliasnvx.catgirl.tools.BlockbenchStarterExport"
    args rootProject.file("art/blockbench").absolutePath, rootProject.projectDir.absolutePath
    // Minecraft's logger writes logs/ into the working directory: keep it out of the source tree
    workingDir = layout.buildDirectory.dir("blockbench-export").get().asFile
    doFirst { workingDir.mkdirs() }
}

// common/src/test holds the dev tool above, no unit tests yet
tasks.named("test") {
    failOnNoDiscoveredTests = false
}
