apply plugin: "com.gradleup.shadow"

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modImplementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }

    // Compat checks in the dev client and the client GameTests: -Pcompat=true loads JEI and Jade
    if (project.findProperty("compat") == "true") {
        modRuntimeOnly("mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}") { transitive false }
        modRuntimeOnly("net.mezzdev.config:mezz_config-${rootProject.minecraft_version}-fabric:${rootProject.mezz_config_version}") { transitive false }
        modRuntimeOnly("maven.modrinth:jade:${rootProject.jade_fabric_version}") { transitive false }
    }
    shadowBundle(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

// Server GameTests: shared bodies in common/.../gametest (the cosmetic slot dupe checks), Fabric glue in src/gametest.
// They run as part of `build` via the generated `runGameTest` task.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "catgirl-test"
        enableGameTests = true
        enableClientGameTests = false // 1.20.1 Fabric API has no client GameTest API
    }
}

// Dev-only check in a real client (1.20.1 has no client GameTest API): the shared DevCheck, started from src/gametest.
// Opens build/run/devCheck/saves/catgirl-check (created flat on the first run), dresses the player, places blocks and
// mobs, takes screenshots into build/run/devCheck/screenshots and quits. ./gradlew :fabric:runDevCheck [-Pcompat=true]
loom {
    runs {
        devCheck {
            client()
            name "Fabric Dev Check"
            source sourceSets.gametest
            runDir "build/run/devCheck"
            property "catgirl.devcheck", "true"
        }
    }
}

// The same DevCheck against the release jar in a production-like client: real Fabric Loader with intermediary names and
// the dependencies' release jars, as players run it. DevCheck isn't in the release jar, so it comes as a second mod
// built from src/gametest plus the shared gametest package. ./gradlew :fabric:runProdDevCheck [-Pcompat=true];
// files in build/run/prodDevCheck
configurations {
    prodMods { transitive = false }
}
dependencies {
    prodMods "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    prodMods "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"
    prodMods "software.bernie.geckolib:geckolib-fabric-${rootProject.minecraft_version}:${rootProject.geckolib_version}"
    if (project.findProperty("compat") == "true") {
        prodMods "mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}"
        prodMods "maven.modrinth:jade:${rootProject.jade_fabric_version}"
    }
}
def devCheckJar = tasks.register("devCheckJar", Jar) {
    from sourceSets.gametest.output
    from(project(":common").sourceSets.main.output) { include "dev/eliasnvx/catgirl/gametest/**" }
    archiveClassifier = "devcheck-dev"
}
def remapDevCheckJar = tasks.register("remapDevCheckJar", net.fabricmc.loom.task.RemapJarTask) {
    inputFile = devCheckJar.flatMap { it.archiveFile }
    archiveClassifier = "devcheck"
}
tasks.register("runProdDevCheck", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(remapJar, remapDevCheckJar, configurations.prodMods)
    jvmArgs.add("-Dcatgirl.devcheck=true")
    runDir = layout.buildDirectory.dir("run/prodDevCheck")
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
    exclude "architectury.common.json"
    exclude "dev/eliasnvx/catgirl/gametest/**" // shared GameTest bodies stay out of the released jar
    from rootProject.file("LICENSE")
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
    archiveClassifier = null
    archiveVersion = "${project.version}+${rootProject.minecraft_version}-fabric"
}
