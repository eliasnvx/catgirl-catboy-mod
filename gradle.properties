org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_id=catgirl
mod_name=Catgirl & Catboy Mod: Ears, Tails & Paws
mod_version=0.1.0
maven_group=dev.eliasnvx
archives_base_name=catgirl

platforms=fabric,neoforge

# Versions checked against maven-metadata / Modrinth on 2026-10-27 (1.21.1 branch)
minecraft_version=1.21.1
java_version=21
fabric_loader_version=0.19.5
fabric_api_version=0.116.17+1.21.1
neoforge_version=21.1.265
architectury_api_version=13.0.11
geckolib_version=4.9.3
jetbrains_annotations_version=26.1.0
junit_version=6.1.3

# Soft dependencies (compat.*), compile only. JEI: maven.blamejared.com. Jade and Curios: Modrinth maven.
jei_version=19.70.0.460
# JEI nests this library mod (mezz_config) in its jar, which a real install unpacks and the dev runtime doesn't
mezz_config_version=0.6.6
jade_fabric_version=15.10.6+fabric
jade_neoforge_version=15.10.6+neoforge
curios_neoforge_version=9.5.1+1.21.1
# JEI's 1.21.1 Fabric jars are built with Loom 1.18, Architectury Loom stops at 1.17: let the dev runtime (-Pcompat) load them
loom.ignoreDependencyLoomVersionValidation=true
