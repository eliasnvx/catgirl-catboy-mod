org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_id=catgirl
mod_name=Catgirl & Catboy Mod: Ears, Tails & Paws
mod_version=0.1.0
maven_group=dev.eliasnvx
archives_base_name=catgirl

platforms=fabric,forge

# Versions checked against maven-metadata / Modrinth on 2026-10-27 (1.20.1 branch)
minecraft_version=1.20.1
java_version=17
fabric_loader_version=0.19.5
fabric_api_version=0.92.12+1.20.1
forge_version=1.20.1-47.4.28
architectury_api_version=9.2.14
geckolib_version=4.8.4
jetbrains_annotations_version=26.1.0
junit_version=6.1.3

# Soft dependencies (compat.*), compile only. JEI: maven.blamejared.com. Jade and Curios: Modrinth maven (Curios by
# version id: one version has several files).
jei_version=15.74.0.230
# JEI nests this library mod (mezz_config) in its jar, which a real install unpacks and the dev runtime doesn't
mezz_config_version=0.6.6
jade_fabric_version=11.13.3+fabric
jade_forge_version=11.13.3+forge
curios_forge_version=IPQlZkz1
# JEI's Fabric jars are built with a newer Loom than Architectury Loom: let the dev runtime (-Pcompat) load them
loom.ignoreDependencyLoomVersionValidation=true
