modLoader = "javafml"
# Forge 47 (1.20.1) language provider
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "eliasnvx"
# Forge 47 reads logoFile as a path from the jar root; pixel art, shown crisp
logoFile = "assets/catgirl/icon.png"
logoBlur = false
description = '''
Catgirl & catboy cosmetics: cat ears, tails, paws and collars with bells, plus a meow key, catnip and a cardboard box.
'''

# Mixins: Forge 47 has no [[mixins]] block, the config is listed in the jar manifest (loom forge.mixinConfig)

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
# forge_version is "<mc>-<forge>"; the range only takes the Forge part
versionRange = "[${forge_version.substring(forge_version.indexOf('-') + 1)},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},1.20.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "architectury"
mandatory = true
versionRange = "[${architectury_api_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
mandatory = true
versionRange = "[${geckolib_version},)"
ordering = "AFTER"
side = "BOTH"

# Soft dependencies (compat.*): used when present, never required
[[dependencies.${mod_id}]]
modId = "jei"
mandatory = false
versionRange = "[15,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "jade"
mandatory = false
versionRange = "[11,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
mandatory = false
versionRange = "[5,)"
ordering = "NONE"
side = "BOTH"
