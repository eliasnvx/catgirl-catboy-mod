apply plugin: "com.gradleup.shadow"

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"
    modImplementation "dev.architectury:architectury-forge:${rootProject.architectury_api_version}"
    modImplementation "software.bernie.geckolib:geckolib-forge-${rootProject.minecraft_version}:${rootProject.geckolib_version}"
    // GeckoLib ships mclib as jar-in-jar; Forge dev runs do not unpack it, so put it on the dev classpath
    forgeRuntimeLibrary "com.eliotlash.mclib:mclib:20"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }

    // Curios: wear our cosmetics in its slots (compat.curios). Compile only; -Pcompat=true also loads Curios and JEI in
    // the dev runs (runClient, runDevCheck)
    modCompileOnly("maven.modrinth:curios:${rootProject.curios_forge_version}") { transitive false }
    if (project.findProperty("compat") == "true") {
        modRuntimeOnly("maven.modrinth:curios:${rootProject.curios_forge_version}") { transitive false }
        modRuntimeOnly("mezz.jei:jei-${rootProject.minecraft_version}-forge:${rootProject.jei_version}") { transitive false }
        modRuntimeOnly("net.mezzdev.config:mezz_config-${rootProject.minecraft_version}-forge:${rootProject.mezz_config_version}") { transitive false }
        // no Jade here: its StringRenderOutputMixin shadows a synthetic field that the Mojang-mapped Forge dev runtime
        // doesn't have (a dev-only failure; Jade is checked on Fabric 1.20.1)
    }
    shadowBundle(project(path: ":common", configuration: "transformProductionForge")) { transitive false }
}

loom {
    forge {
        // Forge only loads mixin configs listed in the jar manifest; Loom writes it from here
        mixinConfig "catgirl.mixins.json"
    }
    runs {
        // Dev-only check in a real client (1.20.1 has no client GameTests): the shared DevCheck opens
        // run/saves/catgirl-check (created flat on the first run), dresses the player, places blocks and mobs, takes
        // screenshots into run/screenshots and quits. ./gradlew :forge:runDevCheck [-Pcompat=true]
        devCheck {
            client()
            name "Forge Dev Check"
            property "catgirl.devcheck", "true"
        }
        // Server GameTests: the shared bodies in common/.../gametest, registered by dev/CatgirlGameTestsForge
        gameTestServer {
            server()
            forgeTemplate("gameTestServer")
            // Forge 47 ForgeGameTestHooks reads these (GameTestMain sets the first two as well)
            property "forge.enableGameTest", "true"
            property "forge.gameTestServer", "true"
            property "forge.enabledGameTestNamespaces", "catgirl"
            name "Forge GameTest Server"
            runDir "build/run/gameTest"
        }
    }
}

// `build` -> `check` -> GameTests on Forge too (Fabric wires runGameTest into build itself)
tasks.named("check") { dependsOn "runGameTestServer" }

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
    exclude "fabric.mod.json"
    exclude "dev/eliasnvx/catgirl/forge/dev/**" // DevCheck and the GameTest glue stay out of the released jar
    exclude "dev/eliasnvx/catgirl/gametest/**"
    exclude "data/catgirl/structures/empty.nbt"
    exclude "architectury.common.json"
    from rootProject.file("LICENSE")
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
    archiveClassifier = null
    archiveVersion = "${project.version}+${rootProject.minecraft_version}-forge"
}
